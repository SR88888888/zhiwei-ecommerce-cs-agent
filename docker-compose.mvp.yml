services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: zhiwei
      POSTGRES_USER: zhiwei
      POSTGRES_PASSWORD: zhiwei_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/infra/postgres:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./apps/api
    env_file: ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://zhiwei:zhiwei_dev@postgres:5432/zhiwei
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  web:
    build: ./apps/web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data: